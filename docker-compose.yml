services:
  web:
    image: nginx:alpine
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./app:/usr/share/nginx/html:ro

  api:
    image: python:3.12-alpine
    command: sh -c "python -m http.server ${PORT}"
    ports:
      - "${PORT}:${PORT}"
    environment:
      MODE: ${MODE}

  tester:
    image: alpine:3.20
    command: sh -c "sleep infinity"